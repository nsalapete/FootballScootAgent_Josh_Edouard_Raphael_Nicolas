# Reverse proxy in front of the API: the only service published on the host. Owner: B.
# Included inside nginx's `http {}` block (mounted as conf.d/default.conf).

# Per-client request budgets (key: client IP). The agent spends LLM credit, so it gets a much smaller one.
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=agent_rate:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types application/json;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;

    location / {
        limit_req zone=api_rate burst=40 nodelay;
        proxy_pass http://api:8000;
    }

    # An agent answer chains several LLM calls: small budget per client.
    location /api/agent/ {
        limit_req zone=agent_rate burst=5 nodelay;
        proxy_pass http://api:8000;
    }

    # GDS refresh and rumour import (protected by X-API-Key) may run for minutes on the full graph.
    location ~ ^/api/(admin|rumours/import) {
        limit_req zone=agent_rate burst=5 nodelay;
        proxy_read_timeout 600s;
        proxy_pass http://api:8000;
    }
}
